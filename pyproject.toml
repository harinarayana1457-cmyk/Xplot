[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xplot"
version = "1.0.0"
description = "Plot XPPAUT .dat output (simulations and AUTO bifurcation diagrams) from the terminal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
xplot = "xplot.cli:main"

[tool.setuptools]
packages = ["xplot"]
